<script>
/* Requests to our own server always use a clean address. If the page was opened with the login
   in the URL (https://user:password@host/), browsers refuse relative fetches outright, which
   used to drop the page silently into browser-only mode with the demo rows. */
(function(){
  const base=location.origin+location.pathname.replace(/[^/]*$/,'');
  const nativeFetch=window.fetch.bind(window);
  window.fetch=(url,opts)=>nativeFetch(typeof url==='string'&&!/^[a-z][a-z0-9+.-]*:/i.test(url)&&!url.startsWith('/')?base+url:url,opts);
})();
/* A hosted server may be asleep and take up to a minute to wake. While it does, a request
   fails or comes back 502/503/504. Every request for data therefore goes through serverFetch,
   which keeps trying for about 90 seconds and shows that it is waiting, so a load or a save
   made during that minute still goes through. It works the same against a local server, where
   it simply succeeds the first time. Anything else (200, 401, 404, 409…) is returned at once. */
const WAKE_STATUSES=[502,503,504];
let wakeWaiters=0;
function showWaking(on){wakeWaiters=Math.max(0,wakeWaiters+(on?1:-1));
  const el=document.getElementById('wakemsg');if(el)el.hidden=wakeWaiters===0;}
async function serverFetch(url,opts,limits){
  const maxMs=(limits&&limits.maxMs)||90000,netMs=(limits&&limits.netMs)||maxMs;
  const start=Date.now();let delay=1000,told=false;
  try{
    for(;;){
      let r=null,err=null;
      try{r=await fetch(url,opts);}catch(e){err=e;}
      if(r&&!WAKE_STATUSES.includes(r.status))return r;
      if(Date.now()-start+delay>(r?maxMs:netMs)){if(r)return r;throw err;}
      if(!told){told=true;showWaking(true);}
      await new Promise(res=>setTimeout(res,delay));delay=Math.min(Math.round(delay*1.6),8000);
    }
  }finally{if(told)showWaking(false);}
}

const today=new Date().toISOString().slice(0,10);
// Closed cards get a dateClosed (cleanup.py archives them 30 days later); reopening clears it.
// The statuses above and the two stamps below must match jobs_store.py (STATUSES, stamp), which
// the skills use; the page keeps its own copy so the tracker also works with no server.
function stampClosed(a){if(!a)return;
  if(HIDDEN.includes(a.status)){if(!a.dateClosed)a.dateClosed=today;}
  else{delete a.dateClosed;delete a.autoClosed;}}
function stampApplied(a){ // when a card lands in Applied, stamp the date + a 7-day follow-up
  if(!a||a.status!=='Applied')return;
  if(!a.dateApplied)a.dateApplied=today;
  if(!a.nextFollowup){const d=new Date(a.dateApplied+'T12:00:00');d.setDate(d.getDate()+7);a.nextFollowup=d.toISOString().slice(0,10);}
}

function uid(){return 'app-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  else{state.apps=structuredClone(SEED);}
  state.apps.forEach(a=>{if(!a.id)a.id=uid();});
}
// The browser copy is the data only when there is no server. With one, the server's copy is
// the only one: nothing is read from or kept in the browser, so a stale copy is never shown
// and nothing stays behind on a shared computer.
function cacheLocal(){if(serverMode)return;try{localStorage.setItem(KEY,JSON.stringify(state.apps));}catch(e){}}
function dropBrowserCopy(){try{localStorage.removeItem(KEY);}catch(e){}}
// False until everything the screens count from has arrived (jobs, people, Autopilot), so each
// screen is drawn once from complete data and never from a partial first guess.
let loaded=false;
const VIEWS=['ymove','board','table','people','companies','interviews','insights'];

  VIEWS.forEach(id=>{document.getElementById(id).innerHTML='<div class="loading" role="status">Loading your tracker…</div>';});}

function save(){cacheLocal();jobsSavedAt=new Date();stamp();if(serverMode){persistServer();}else{persistFile();}}

  const target=serverMode?'data.json':usingFile&&fileHandle?fileHandle.name:'this browser';
  const where=jobsSavedAt?`Saved to ${target} · ${jobsSavedAt.toLocaleString()}`:`Loaded from ${target}`;
  const tip=serverMode?'Server owns the file · rolling backups in Data/backups/.':usingFile?'Backed by a file on disk.':'Link a file or Export to back up / move devices.';
  f.innerHTML=`<span>${n} application${n===1?'':'s'}</span><span>${where}</span><span>${tip}</span>`;}

/* ---------- Local server sync (server.py) ----------
   When the app is served by server.py, the server owns data.json:
   reads on load, atomic writes on every change, rolling backups.
   Detected via /health; when absent (file://, GitHub Pages) the app
   falls back to the File System Access API / localStorage below. */
let serverMode=false, srvWriting=false, srvPending=false, dataRevision='';
let serverLoadError=''; // set when the tracker server is there but our data couldn't be loaded
async function initServerSync(){
  try{
    if(location.protocol==='file:')return false;           // opened as a file: there is no server
    let h;try{h=await serverFetch('health',{cache:'no-store'},{netMs:12000});}catch(e){return false;}
    if(WAKE_STATUSES.includes(h.status)){serverLoadError='the server did not wake up (HTTP '+h.status+')';return false;}
    if(!h.ok)return false;                                   // e.g. 404 on plain file hosting: no tracker server
    const hj=await h.json();if(!hj.ok)return false;
    // From here on a tracker server is definitely there, so a failure is an error to show,
    // never a reason to fall back to the demo rows.
    serverLoadError='could not reach the server';
    const r=await serverFetch('data.json',{cache:'no-store'});
    if(!r.ok){serverLoadError=r.status===401?'you are signed out; reload to sign in':'the server answered HTTP '+r.status;return false;}
    const data=await r.json();if(!Array.isArray(data)){serverLoadError='the server sent unexpected data';return false;}
    serverLoadError='';
    dataRevision=r.headers.get('X-Data-Revision')||'';
    serverMode=true;state.apps=data;state.apps.forEach(a=>{if(!a.id)a.id=uid();});
    dropBrowserCopy();window.autopilotReady=loadAutopilot();return true;
  }catch(e){return false;}
}
async function persistServer(){
  if(!serverMode)return;
  if(srvWriting){srvPending=true;return;}
  srvWriting=true;
  try{
    const r=await serverFetch('save',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Revision':dataRevision},body:JSON.stringify(state.apps)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){
      // Someone else saved first (a Claude run, another tab, or the copy on GitHub).
      srvWriting=false;srvPending=false;
      await reloadFromServer();
      toast('Jobs changed elsewhere (a Claude run or another device?) — reloaded the latest. Please redo your last change.');
      return;
    }
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(j.revision)dataRevision=j.revision;
    if(j.syncWarning)toast('⚠ Saved here, but not yet to GitHub — it will retry on the next save.');
  }catch(e){
    toast('⚠ Save to data.json failed — this change is only in this open page and will be lost on reload. Is the tracker server running?',6000);
  }
  srvWriting=false;
  if(srvPending){srvPending=false;persistServer();}
}
/* Re-read data.json if it changed since we loaded it — on a 409, and when the
   tab comes back into view, so a tab left open picks up a scrub or reply check
   that ran meanwhile (and, on a hosted copy, saves from other devices). */
let reloadingJobs=false; // one refresh at a time, however often the tab regains focus while the server wakes
async function reloadFromServer(){
  if(!serverMode||reloadingJobs)return;
  reloadingJobs=true;
  try{
    const r=await serverFetch('data.json',{cache:'no-store'});if(!r.ok)return;
    const rev=r.headers.get('X-Data-Revision')||'';
    if(rev&&rev===dataRevision)return;
    const data=await r.json();if(!Array.isArray(data))return;
    dataRevision=rev;state.apps=data;state.apps.forEach(a=>{if(!a.id)a.id=uid();});
    cacheLocal();initFilters();render();
  }catch(e){}
  finally{reloadingJobs=false;}
}
function maybeReloadJobs(){if(serverMode&&!srvWriting&&!srvPending&&!editingId)reloadFromServer();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')maybeReloadJobs();});
window.addEventListener('focus',maybeReloadJobs);
/* The server can open links and show files only on the computer it runs on. On a hosted
   copy (e.g. Render) the browser opens links itself, and documents are downloaded instead. */
const localServer=['localhost','127.0.0.1','[::1]'].includes(location.hostname);
function openExternal(url){
  if(serverMode&&localServer){fetch('open?url='+encodeURIComponent(url)).then(r=>{if(!r.ok)window.open(url,'_blank');}).catch(()=>window.open(url,'_blank'));}
  else{window.open(url,'_blank');}
}
/* In server mode send job links to the default browser (on a hosted copy: a new tab). */
document.addEventListener('click',e=>{
  if(!serverMode)return;
  const a=e.target.closest('a[href^="http"]');
  if(!a)return;
  e.preventDefault();openExternal(a.href);
});

/* ---------- File System Access: durable, portable storage ---------- */
const supportsFS = 'showOpenFilePicker' in window;
const FT=[{description:'Tracker data (JSON)',accept:{'application/json':['.json']}}];
let fileHandle=null, usingFile=false, writing=false, pendingWrite=false, toastT=null;

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('launchpad_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(k){const db=await idb();return new Promise((res)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();});}

function toast(msg,ms){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.className='show';clearTimeout(toastT);toastT=setTimeout(()=>t.className='',ms||2800);}

async function useHandle(h){fileHandle=h;usingFile=true;try{await idbSet('handle',h);}catch(e){}updateFileStatus();}
async function loadFromFile(){const f=await fileHandle.getFile();const txt=await f.text();
  if(txt.trim()){const data=JSON.parse(txt);if(Array.isArray(data)){state.apps=data;state.apps.forEach(a=>{if(!a.id)a.id=uid();});cacheLocal();}}
  stamp();updateFileStatus();}
async function writeToFile(){if(!fileHandle)return;const w=await fileHandle.createWritable();await w.write(JSON.stringify(state.apps,null,2));await w.close();stamp();updateFileStatus();}
async function persistFile(){if(!usingFile||!fileHandle)return;if(writing){pendingWrite=true;return;}writing=true;
  try{await writeToFile();}catch(e){usingFile=false;updateFileStatus();alert('Lost write access to the data file (permission may have been revoked). Switched to browser storage — use “Open file” to relink.');}
  writing=false;if(pendingWrite){pendingWrite=false;persistFile();}}

async function linkOpen(){try{const [h]=await window.showOpenFilePicker({types:FT,multiple:false});await useHandle(h);await loadFromFile();render();toast('Linked '+h.name+' — changes now save to this file.');}catch(e){if(e.name!=='AbortError')alert('Could not open file: '+e.message);}}
async function linkNew(){try{const h=await window.showSaveFilePicker({suggestedName:'launchpad-data.json',types:FT});await useHandle(h);await writeToFile();render();toast('Created '+h.name+' — changes now save to this file.');}catch(e){if(e.name!=='AbortError')alert('Could not create file: '+e.message);}}
async function unlinkFile(){const n=fileHandle&&fileHandle.name;usingFile=false;fileHandle=null;try{await idbDel('handle');}catch(e){}updateFileStatus();stamp();toast((n||'File')+' unlinked — now using browser storage.');}
async function reconnect(){if(!fileHandle)return;let p='denied';try{p=await fileHandle.requestPermission({mode:'readwrite'});}catch(e){}
  if(p==='granted'){usingFile=true;try{await loadFromFile();render();toast('Reconnected '+fileHandle.name+'.');}catch(e){usingFile=false;}updateFileStatus();}
  else{alert('Permission denied — staying on browser storage.');}}

function updateFileStatus(mode){
  const chip=document.getElementById('filestat');if(!chip)return;
  const bOpen=document.getElementById('btnOpen'),bSave=document.getElementById('btnSaveAs'),bRe=document.getElementById('btnReconnect'),bUn=document.getElementById('btnUnlink');
  if(serverMode){chip.textContent='data.json · synced with the server';chip.className='filechip ok';
    bOpen.style.display='none';bSave.style.display='none';bRe.style.display='none';bUn.style.display='none';return;}
  if(supportsFS){bOpen.style.display='';bSave.style.display='';}
  bRe.style.display='none';bUn.style.display='none';
  if(!supportsFS){chip.textContent='Browser storage (this browser only)';chip.className='filechip';return;}
  if(usingFile&&fileHandle){chip.textContent=fileHandle.name+' · file-synced';chip.className='filechip ok';bUn.style.display='';}
  else if(mode==='needs'&&fileHandle){chip.textContent=fileHandle.name+' · needs reconnect';chip.className='filechip warn';bRe.style.display='';bRe.textContent='Reconnect '+fileHandle.name;}
  else{chip.textContent='Browser storage — not linked';chip.className='filechip';}
}
async function initFileSync(){
  if(!supportsFS){updateFileStatus();return;}
  let h=null;try{h=await idbGet('handle');}catch(e){}
  if(!h){updateFileStatus();return;}
  fileHandle=h;
  let perm='prompt';try{perm=await h.queryPermission({mode:'readwrite'});}catch(e){}
  if(perm==='granted'){usingFile=true;try{await loadFromFile();render();}catch(e){usingFile=false;}updateFileStatus();}
  else{updateFileStatus('needs');}
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function pill(s){return `<span class="pill t-${TONE[s]||'grey'}">${esc(s)}</span>`;}
function stageOf(s){for(const st of STAGES){if(st.match.includes(s))return st.key;}return 'Screening';}
function dueClass(d){return d&&d<=today?'due':'';}

// One switch for the screen and, on Jobs and People, one for the layout (Board | Table).
const SCREENS={
  move:['Today','What needs you, most urgent first.'],
  jobs:['Jobs','Every role you are tracking, from first look to offer.'],
  people:['People','Who can refer you, and where each conversation stands.'],
  companies:['Companies','Each company with its roles, its people and the next step.'],
  interviews:['Interviews','Rounds coming up, rounds to schedule, and how past ones went.'],
  insights:['Insights','']};
const NAV=[['dm','move'],['dj','jobs'],['dp','people'],['dc','companies'],['dv','interviews'],['di','insights']];
function applyChrome(){const P=dataset==='people',J=dataset==='jobs',C=dataset==='companies';
  NAV.forEach(([id,d])=>{const b=document.getElementById(id);b.classList.toggle('on',dataset===d);if(dataset===d)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  document.getElementById('ptitle').textContent=SCREENS[dataset][0];
  document.getElementById('psub').textContent=SCREENS[dataset][1];
  document.title=SCREENS[dataset][0]+' · LaunchPad';
  const show=(id,on)=>document.getElementById(id).classList.toggle('hidden',!on);
  show('ymove',dataset==='move');show('insights',dataset==='insights');show('companies',C);show('interviews',dataset==='interviews');
  show('board',J&&view==='board');show('table',J&&view==='table');show('people',P);
  // Search works on Jobs, People and the Companies list; the other screens are plain pages.
  document.getElementById('controls').style.display=(J||P||(C&&!companyOpen))?'':'none';
  document.getElementById('viewseg').style.display=(J||P)?'':'none';
  document.getElementById('vb').classList.toggle('on',view==='board');document.getElementById('vt').classList.toggle('on',view==='table');
  const showCols=J&&view==='board';const cw=document.getElementById('colwrap');if(cw){cw.style.display=showCols?'':'none';if(!showCols)document.getElementById('colmenu').classList.remove('show');}
  // Job-only controls act on data.json, so they're hidden elsewhere (People has its own stat cards).
  ['kpis','sf','lblHide'].forEach(id=>{document.getElementById(id).style.display=J?'':'none';});
  // Add belongs to the two boards and Interviews; elsewhere `n` and the palette still add a job.
  const add=document.getElementById('btnAdd');add.textContent=P?'+ Add person':dataset==='interviews'?'+ Add interview':'+ Add job';add.style.display=(J||P||dataset==='interviews')?'':'none';
  document.getElementById('q').placeholder=P?'Search people…':C?'Search companies…':'Search company, role, notes…';
  if(!P){stamp();updateFileStatus();}
  writeHash();}
// The URL remembers the screen and its layout (#jobs, #people/table, #companies/<name>…),
// so a refresh, bookmark or new tab opens the same screen. With no hash the tracker opens on Today.
function readHash(){const raw=location.hash.slice(1),i=raw.indexOf('/'),d=i<0?raw:raw.slice(0,i),v=i<0?'':raw.slice(i+1);
  dataset=SCREENS[d]?d:(raw?'jobs':'move');companyOpen='';
  if(dataset==='companies'){try{companyOpen=decodeURIComponent(v);}catch(e){}}
  else view=v==='table'?'table':'board';}
function writeHash(){const tail=dataset==='companies'?(companyOpen?'/'+encodeURIComponent(companyOpen):''):(view==='table'&&(dataset==='jobs'||dataset==='people')?'/table':'');
  const h='#'+dataset+tail;if(location.hash!==h)history.replaceState(null,'',h);}
window.addEventListener('hashchange',()=>{const d=dataset;readHash();const nd=dataset;dataset=d;if(nd!==d)setDataset(nd,true);else{applyChrome();render();}});
function setView(v){view=v;applyChrome();render();}
// Each screen keeps its own search text, so a jobs search doesn't silently filter people.

function setDataset(d,keepCompany){const q=document.getElementById('q');searchByDataset[dataset]=q.value;if(!keepCompany)companyOpen='';dataset=d;q.value=searchByDataset[d]||'';applyChrome();render();window.scrollTo(0,0);}
function addClicked(){if(dataset==='people'&&window.People)People.openAdd();else if(dataset==='interviews'&&window.Screens)Screens.addInterview();else openEdit(null);}

function visible(list){const q=document.getElementById('q').value.toLowerCase();const sf=document.getElementById('sf').value;const hide=document.getElementById('sc').checked;
  return list.filter(a=>{
    if(hide&&HIDDEN.includes(a.status))return false;
    if(sf&&a.status!==sf)return false;
    if(q&&!(`${a.company} ${a.role} ${a.notes}`.toLowerCase().includes(q)))return false;
    return true;});}

function kpis(list){const c=s=>list.filter(a=>a.status===s).length;
  const screening=c('Screening')+c('Researching');
  const toapply=c('To Apply');
  const applied=['Applied','Phone Screen','Interviewing','Take-home','Final Round','Offer','Accepted'].reduce((n,s)=>n+c(s),0);
  const inproc=c('Phone Screen')+c('Interviewing')+c('Take-home')+c('Final Round');
  const offers=c('Offer')+c('Accepted');
  const due=list.filter(a=>a.nextFollowup&&a.nextFollowup<=today&&!HIDDEN.includes(a.status)&&a.status!=='Accepted').length;
  const k=[['Tracked',list.length],['Screening',screening],['To apply',toapply],['Applied',applied],['In process',inproc],['Offers',offers],['Follow-ups due',due]];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('');}

function tierOf(a){return a.tier||((/Tier\s*([ABC])\b/.exec(a.notes||'')||[])[1]||'');}

/* Autopilot switches (Data/autopilot.json via the server). Off until you switch them on. */
window.AUTOPILOT=null;let apRevision='';
async function loadAutopilot(){try{const r=await serverFetch('autopilot.json',{cache:'no-store'});if(!r.ok)return;
  window.AUTOPILOT=await r.json();apRevision=r.headers.get('X-Autopilot-Revision')||'';render();}catch(e){}}
async function saveAutopilot(){if(!serverMode||!window.AUTOPILOT)return;
  try{const r=await serverFetch('save-autopilot',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Revision':apRevision},body:JSON.stringify(window.AUTOPILOT)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){await loadAutopilot();toast('Autopilot settings changed elsewhere — reloaded. Please redo your change.');return;}
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    if(j.revision)apRevision=j.revision;if(j.autopilot)window.AUTOPILOT=j.autopilot;
    toast('Autopilot saved');}
  catch(e){toast('⚠ Could not save autopilot: '+e.message);}
  render();}
function autopilotCard(){const ap=YourMove.autopilot(window.AUTOPILOT),dis=serverMode&&window.AUTOPILOT?'':' disabled';
  const tier=t=>`<label class="aptier"><input type="checkbox" data-ap="tier" value="${t}"${ap.jobs.tiers.includes(t)?' checked':''}${dis}> ${t}</label>`;
  return `<section class="ymsec apcard"><h3>Autopilot <span class="apsub">${dis?'needs the tracker server':'fewer approvals: decide the rule once, veto exceptions'}</span></h3>
  <div class="aprow"><label class="apsw"><input type="checkbox" data-ap="jobs"${ap.jobs.enabled?' checked':''}${dis}><span></span></label>
    <div><strong>Jobs</strong> — approve Screening roles with fit ≥ <input type="number" min="50" max="100" step="5" data-ap="minFit" value="${ap.jobs.minFit}"${dis}> in tier ${tier('A')}${tier('B')}${tier('C')}
    <div class="apsub">The next run moves them to To Apply and connects with their people. They show here for a day so you can undo.</div></div></div>
  <div class="aprow"><label class="apsw"><input type="checkbox" data-ap="messages"${ap.messages.enabled?' checked':''}${dis}><span></span></label>
    <div><strong>Messages</strong> — send drafted asks and follow-ups automatically <input type="number" min="0" max="72" step="1" data-ap="holdHours" value="${ap.messages.holdHours}"${dis}> h after they're drafted
    <div class="apsub">Read them whenever you like; tick <em>Hold</em> on a person to stop one. Replies to people who answered and emails still wait for you.</div></div></div>
  </section>`;}
document.addEventListener('change',e=>{const t=e.target.closest&&e.target.closest('[data-ap]');if(!t||!window.AUTOPILOT)return;
  const ap=window.AUTOPILOT=YourMove.autopilot(window.AUTOPILOT),k=t.dataset.ap;
  if(k==='jobs')ap.jobs.enabled=t.checked;
  else if(k==='messages')ap.messages.enabled=t.checked;

  else if(k==='tier')ap.jobs.tiers=['A','B','C'].filter(x=>x===t.value?t.checked:ap.jobs.tiers.includes(x));

/* Bulk review: one list, one click, instead of approving cards one by one. */
let ymOpen='';
function bulkJobs(){return state.apps.filter(a=>(a.status==='Screening'||a.status==='Researching')&&!YourMove.autoApproveJob(a,window.AUTOPILOT))
  .sort((x,y)=>(parseInt(y.fitScore)||0)-(parseInt(x.fitScore)||0));}
function bulkMsgs(){return ymContacts().filter(c=>{const m=YourMove.forContact(c,state.apps,window.AUTOPILOT);return m&&m.verb==='Approve message';});}
function bulkPanel(kind){
  if(kind==='jobs'){const js=bulkJobs(),cs=ymContacts();
    const rows=js.map(a=>{const n=cs.filter(c=>(c.stage==='Found'||c.stage==='Queued')&&((c.appIds||[]).includes(a.id)||(!(c.appIds||[]).length&&c.company===a.company))).length;
      const pre=(parseInt(a.fitScore)||0)>=80||/recommended/i.test(a.notes||'');
      return `<label class="bkrow"><input type="checkbox" data-bk="${a.id}"${pre?' checked':''}><span class="bkmain"><strong>${esc(a.company)}</strong> — ${esc(a.role)} ${tierBadge(a)}
        <span class="bksub">fit ${esc(a.fitScore||'?')} · ${esc(a.location||'')}${n?' · '+n+' to connect':''}${/recommended/i.test(a.notes||'')?' · recommended':''}</span></span></label>`;}).join('');
    return `<div class="bkpanel" data-kind="jobs"><div class="bkbar"><span class="bkall" data-bkall="1">Select all</span> · <span class="bkall" data-bkall="0">none</span></div>${rows}
      <div class="bkbtns"><span class="minibtn go" data-bkdo="approve">✓ Approve selected → To Apply</span><span class="minibtn" data-bkdo="drop">✗ Drop selected</span></div></div>`;}
  const ms=bulkMsgs();
  const rows=ms.map(c=>`<label class="bkrow"><input type="checkbox" data-bk="${esc(c.id)}" checked><span class="bkmain"><strong>${esc(c.name)}</strong> · ${esc(c.company)} <span class="bksub">${esc(c.relation||'')}</span>
    <span class="bkmsg">${esc(c.askMessage)}</span></span></label>`).join('');
  return `<div class="bkpanel" data-kind="msgs"><div class="bkbar"><span class="bkall" data-bkall="1">Select all</span> · <span class="bkall" data-bkall="0">none</span> · untick any you want to hold back</div>${rows}
    <div class="bkbtns"><span class="minibtn go" data-bkdo="approve">✓ Approve selected messages</span></div></div>`;}
function bulkDo(panel,action){const ids=[...panel.querySelectorAll('[data-bk]:checked')].map(x=>x.dataset.bk);
  if(!ids.length){toast('Nothing selected');return;}
  if(panel.dataset.kind==='jobs'){const to=action==='approve'?'To Apply':"Won't Apply";
    ids.forEach(id=>{const a=state.apps.find(x=>x.id===id);if(a){a.status=to;stampApplied(a);stampClosed(a);}});
    save();ymOpen='';render();
    toast(ids.length+(ids.length===1?' role':' roles')+' → '+to+(to==='To Apply'?' · their people get connection requests on the next run':''));return;}
  let n=0;ymContacts().forEach(c=>{if(ids.includes(c.id)&&window.PeopleCore&&PeopleCore.canApproveAsk(c)){c.askApproved=true;n++;}});
  if(window.People&&People.commit)People.commit();ymOpen='';render();
  toast(n+(n===1?' message':' messages')+' approved · they go out on the next run');}
document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
  const open=t.closest('[data-bkopen]');if(open){e.stopPropagation();ymOpen=ymOpen===open.dataset.bkopen?'':open.dataset.bkopen;renderYourMove();return;}
  const all=t.closest('[data-bkall]');if(all){all.closest('.bkpanel').querySelectorAll('[data-bk]').forEach(x=>x.checked=all.dataset.bkall==='1');return;}
  const d=t.closest('[data-bkdo]');if(d)bulkDo(d.closest('.bkpanel'),d.dataset.bkdo);},true);

// The "Your move" tab: everything that needs you, grouped by urgency. Rules live in your-move.js.
function renderYourMove(){const el=document.getElementById('ymove');if(!el||!window.YourMove)return;
  const cs=ymContacts();
  const s=YourMove.summary(state.apps,cs,today,ymDays(),window.AUTOPILOT);
  const byCo=verb=>{const m={};cs.forEach(c=>{const x=YourMove.forContact(c,state.apps,window.AUTOPILOT);if(x&&x.verb===verb)m[c.company]=(m[c.company]||0)+1;});
    return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>k+' '+m[k]).join(' · ');};
  const waitJobs=state.apps.map(a=>({a,m:ymJob(a)})).filter(x=>x.m&&x.m.level==='wait');
  const groups=[['red','Overdue'],['amber','Needs you'],['grey','When you have a minute']];
  const line=(l,i)=>{let sub=l.sub;
    if(l.target.type==='people'&&/Approve outreach/.test(l.text)){const m=byCo('Approve message');
      sub+=(m?' · '+m:'');}
    const bk=l.target.type==='screening'?'jobs':l.target.type==='people'&&/Approve outreach/.test(l.text)?'msgs':'';
    return `<div class="ymline ymline-${l.level}" data-ym="${i}"><span class="ymtext"><strong>${esc(l.text)}</strong><span class="ymsub">${esc(sub)}</span></span>`+
      (bk?`<span class="minibtn go" data-bkopen="${bk}">${ymOpen===bk?'Close':'Review all'}</span>`:'')+`<span class="ymgo">→</span></div>`+
      (bk&&ymOpen===bk?bulkPanel(bk):'');};
  let h='';
  if(!s.lines.length)h+=`<div class="ymempty">Nothing needs you right now.</div>`;
  groups.forEach(([lv,title])=>{const ls=s.lines.map((l,i)=>[l,i]).filter(([l])=>l.level===lv);
    if(ls.length)h+=`<section class="ymsec"><h3><i class="dot ${lv}"></i>${title} <span class="ct">${ls.length}</span></h3>${ls.map(([l,i])=>line(l,i)).join('')}</section>`;});
  if(waitJobs.length||s.waiting){
    h+=`<section class="ymsec ymsec-wait"><h3><i class="dot wait"></i>Waiting on others</h3>`+
      (s.waiting?`<div class="ymwait">${esc(s.waiting)}</div>`:'')+
      waitJobs.map(({a,m})=>`<div class="ymline ymline-wait" data-job="${a.id}"><span class="ymtext"><strong>${esc(a.company)} — ${esc(a.role)}</strong><span class="ymsub">${esc(m.verb)} · ${esc(m.why)}</span></span><span class="ymgo">→</span></div>`).join('')+
      `</section>`;}
  const n=s.count,day=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const hero=`<div class="hero"><div class="big${n?'':' zero'}">${n}</div><div><div class="hl">${n===1?'thing needs you':'things need you'}</div><div class="hs">${esc(day)}. Click a line to go to it, or <strong>Review all</strong> to approve a whole batch at once. Approving a job connects with its people automatically on the next run.</div></div></div>`;
  el.innerHTML=`<div class="ympage">${hero}${h}${autopilotCard()}</div>`;
  el.querySelectorAll('[data-ym]').forEach(n=>n.addEventListener('click',()=>ymGo(s.lines[+n.dataset.ym].target)));
  el.querySelectorAll('[data-job]').forEach(n=>n.addEventListener('click',()=>ymGo({type:'job',id:n.dataset.job})));}
function ymGo(tg){
  if(tg.type==='people'){setDataset('people');return;}
  if(dataset!=='jobs')setDataset('jobs');
  if(tg.type==='autoapproved'){document.getElementById('sf').value='';document.getElementById('q').value='autopilot';if(view!=='board')setView('board');else render();return;}
  if(tg.type==='autoclosed'){document.getElementById('sf').value='';document.getElementById('sc').checked=false;document.getElementById('q').value='auto-closed';if(view!=='board')setView('board');else render();return;}
  if(tg.type==='screening'){document.getElementById('sf').value='Screening';if(view!=='board')setView('board');else render();return;}
  if(tg.type==='job'){document.getElementById('sf').value='';document.getElementById('q').value='';
    const a=state.apps.find(x=>x.id===tg.id);if(a){const st=stageOf(a.status);collapsedCols.delete(st);hiddenCols.delete(st);}
    if(view!=='board')setView('board');else render();
    const el=document.querySelector(`.cardx[data-id="${tg.id}"]`);if(el)el.scrollIntoView({block:'center',inline:'center'});
    if(window.Screens)Screens.openJob(tg.id);}}
/* Why a role scored what it did: six parts, 0-5 each, written by the search skills into
   fitBreakdown. Shown only when a card has them; fitScore stays the overall judgment. */
const FIT_PARTS=[['role','Role','The day-to-day work against your target titles'],['skills','Skills','Must-have skills your resume covers'],
  ['level','Level','Seniority and years asked against yours'],['pay','Pay','Stated pay against your floor (3 = not stated)'],
  ['location','Location','Arrangement and location against your thesis'],['posting','Posting','Is it real and fresh: date, requisition ID, reposts (3 = no signal)']];
function fitParts(a){const b=a.fitBreakdown;if(!b||typeof b!=='object')return '';
  const parts=FIT_PARTS.filter(([k])=>b[k]!==''&&b[k]!=null&&!isNaN(+b[k])).map(([k,l,t])=>{const n=Math.max(0,Math.min(5,+b[k]));
    return `<span class="fitp fitp-${n>=4?'hi':n>=3?'mid':'lo'}" title="${esc(t)}">${l} ${n}</span>`;});
  return parts.length?`<p class="fitrow"><span>Fit ${esc(String(a.fitScore||'?'))}, out of 5 each:</span>${parts.join('')}</p>`:'';}
function fitCls(v){const n=parseInt(v)||0;return n>=85?'fit-hi':n>=70?'fit-mid':'fit-lo';}

function renderInsights(){const el=document.getElementById('insights');if(!el||!window.Insights)return;
  const cfg=(window.People&&People.config&&People.config())||{};
  const r=Insights.compute(state.apps,ymContacts(),today,{followupDays:ymDays(),staleInviteDays:cfg.staleInviteDays});
  if(r.empty){el.innerHTML='<div class="inpage"><div class="ymempty">Nothing to measure yet. Add roles and people, and this page fills in.</div></div>';return;}
  const rate=s=>s.rate==null?'':`<span class="rate"> · ${s.rate}% ${esc(s.of)}</span>`;
  const funnel=(title,steps)=>{const max=Math.max(1,...steps.map(s=>s.count));
    return `<div class="infunnel"><h4>${title}</h4>${steps.map(s=>`<div class="instep"><span>${esc(s.label)}${rate(s)}</span><span class="n">${s.count}</span><span class="bar"><i style="width:${Math.round(100*s.count/max)}%"></i></span></div>`).join('')}</div>`;};
  const pc=(n,of,r)=>of?`${n} <span class="inlow">(${r}%)</span>`:'<span class="inlow">–</span>';
  const table=(heads,rows)=>`<div class="intable"><table><thead><tr>${heads.map((h,i)=>`<th${i?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(c=>`<tr>${c.map((v,i)=>`<td${i?' class="num"':''}>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const m=r.medians,med=[m.toAccept!=null?`requests are accepted in a median of ${m.toAccept} day${m.toAccept===1?'':'s'}`:'',m.toReply!=null?`asks are answered in a median of ${m.toReply} day${m.toReply===1?'':'s'}`:''].filter(Boolean).join(' · ');
  const stuck=r.stuck.filter(x=>x.count);
  let h='<div class="inpage"><p class="ymintro">Where roles and outreach are getting through, and where they stall. Worked out from what is on the board now; archived cards and people are not counted.</p>';
  h+=`<div class="innotes"><strong>What stands out</strong>${r.notes.length?`<ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:`<div class="apsub" style="margin-top:4px">${r.thin?'Not enough data yet for patterns. They start to show after a few weeks of applications and outreach.':'Nothing unusual in the numbers below.'}</div>`}</div>`;
  h+=`<h3>Funnels</h3><div class="infunnels">${funnel('Roles',r.jobFunnel)}${funnel('Referral outreach',r.outreachFunnel)}</div>`+(med?`<p class="apsub" style="margin:8px 2px 0">${esc(med.charAt(0).toUpperCase()+med.slice(1))}.</p>`:'');
  if(stuck.length)h+=`<h3>Sitting still</h3><div class="kpis">${stuck.map(x=>`<div class="kpi" title="${esc(x.detail)}"><div class="n">${x.count}</div><div class="l">${esc(x.label)}</div></div>`).join('')}</div>`;
  if(r.byRelation.length)h+='<h3>Outreach by relation <span class="apsub">who accepts and who replies</span></h3>'+table(['Relation','People','Requests','Accepted','Asked','Replied','Referred'],
    r.byRelation.map(x=>[esc(x.relation),x.people,x.requested,pc(x.accepted,x.requested,x.acceptRate),x.asked,pc(x.replied,x.asked,x.replyRate),x.referred]));
  if(r.byTier.length)h+='<h3>Roles by tier</h3>'+table(['Tier','Roles','Average fit','Approved','Applied'],r.byTier.map(x=>[esc(x.tier),x.roles,x.avgFit==null?'<span class="inlow">–</span>':x.avgFit,x.approved,x.applied]));
  if(r.bySource.length)h+='<h3>Roles by source <span class="apsub">where the roles you approve come from</span></h3>'+table(['Source','Roles','Approved','Applied','Interviewing'],r.bySource.slice(0,10).map(x=>[esc(x.source),x.roles,x.approved,x.applied,x.interview]));
  el.innerHTML=h+'<p class="apsub" style="margin:14px 2px">Percentages on small counts move a lot; read the counts first.</p></div>';}
function ageStr(d){if(!d)return '';const n=Math.round((Date.parse(today)-Date.parse(d))/86400000);
  if(isNaN(n))return '';if(n<=0)return 'today';if(n===1)return 'yesterday';if(n<7)return n+' days ago';if(n<30)return Math.floor(n/7)+'w ago';if(n<365)return Math.floor(n/30)+'mo ago';return Math.floor(n/365)+'y ago';}

/* ---------- documents (written by Claude, surfaced here) ---------- */
/* The app does not generate anything. Applications use the base resume set in
   outreach-config.json (baseResumePath) unless a card has a tailored one. A Claude
   run drafts a per-role referral note for each To Apply card into referralMD
   (plus Applications/<Company>/… .md), and stamps the outcome into notes as
   [docs: generated …] or [docs: skipped … — reason]. resumeMD/coverMD/…Link hold
   tailored docs (written by generate-docs, or added by hand); prepMD holds the
   interview-prep skill's document. */
function baseResume(){return (window.People&&People.baseResume&&People.baseResume())||'';}
function hasPrep(a){return !!(a.prepMD||a.prepLink);}
function prepSection(a){return hasPrep(a)?`<div class="docs">${docLink(a,'prep')}</div>`:'';}
function hasDocs(a){return !!(a.referralMD||a.resumeMD||a.coverMD||a.resumeLink||a.coverLink);}
function docMarkers(a){const n=a.notes||'';
  return {gen:/\[docs: generated (\d{4}-\d{2}-\d{2})/.exec(n),
          skip:/\[docs: skipped (\d{4}-\d{2}-\d{2})\s*[—–-]+\s*([^\]]*)\]/.exec(n)};}
function cleanNotes(n){return (n||'').replace(/\s*\[docs:[^\]]*\]/g,'').trim();}
function docBadge(a){
  if(hasDocs(a))return '<span class="okc" title="Referral note ready · applying with the base resume">Docs ✓</span>';
  const m=docMarkers(a);
  if(m.skip)return '<span class="warnc" title="Doc generation skipped — open the job for the reason">Docs skipped</span>';
  if(a.status==='To Apply')return '<span title="Base resume ready · the daily run will draft the referral note">Docs pending</span>';
  return '';}
function docsSection(a){
  const m=docMarkers(a);
  if(hasDocs(a)){
    const note=m.gen?`<div class="docstat ok">✓ Docs ready ${esc(m.gen[1])} — referral note to share once someone agrees to refer</div>`:'';
    return `<div class="docs">${docLinks(a)}</div>${note}`;}
  if(m.skip)return `<div class="docstat warn">⚠ Docs skipped ${esc(m.skip[1])} — ${esc(m.skip[2]||'see notes')}<span class="minibtn" onclick="retryDocs('${a.id}')">Retry</span></div>`;
  if(a.status==='To Apply')return `<div class="docstat">Base resume · the referral note is drafted automatically on the next daily run</div>`;
  return '';}
function retryDocs(id){const a=state.apps.find(x=>x.id===id);if(!a)return;
  a.notes=cleanNotes(a.notes);
  save();render();toast('Retry queued — the next daily run will redraft docs for '+a.company+'.');}
const DOC_KIND={resume:{md:'resumeMD',link:'resumeLink',path:'resumePath',label:'Résumé',kind:'Resume',folder:'Resume/Tailored'},
  cover:{md:'coverMD',link:'coverLink',path:'coverPath',label:'Cover letter',kind:'Cover Letter',folder:'Cover Letters/Tailored'},
  referral:{md:'referralMD',link:'referralLink',path:'referralPath',label:'Referral note',kind:'Referral Note',folder:'Applications'},
  prep:{md:'prepMD',link:'prepLink',path:'prepPath',label:'Interview prep',kind:'Interview Prep',folder:'Interview Prep'}};
function docLinks(a){
  const br=baseResume();
  const base=(a.resumeMD||a.resumeLink)?'':`<span class="minibtn" title="${esc(br||'Set baseResumePath in outreach-config.json')}" ${br&&serverMode&&localServer?'onclick="revealPath(baseResume())"':''}>Base resume</span>`;
  return base+docLink(a,'resume')+docLink(a,'referral')+docLink(a,'cover');}
function docLink(a,which){
  const k=DOC_KIND[which];
  const ext=a[k.link];
  const md=a[k.md];
  const label=k.label;
  if(md){let h=`<span class="minibtn" onclick="openDoc('${a.id}','${which}')" title="View Claude-written draft">${label}</span>`;
    if(serverMode&&localServer)h+=`<span class="minibtn" onclick="revealDoc('${a.id}','${which}')" title="Show the file in your file manager — drag it straight into the application">Show file</span>`;
    else h+=`<span class="minibtn" onclick="downloadDoc('${a.id}','${which}')" title="Download .md">Download</span>`;
    return h;}
  if(ext)return `<a class="btnlink" href="${esc(ext)}" target="_blank" rel="noopener">${label} ↗</a>`;
  return '';
}
function revealDoc(id,which){const a=state.apps.find(x=>x.id===id);if(!a)return;
  const k=DOC_KIND[which];
  const name=((a.company||'')+' - '+(a.role||'')+' - '+k.kind+'.docx').replace(/[\/:]/g,'');
  revealPath(a[k.path]||(k.folder+'/'+name));
}
function revealPath(path){
  fetch('reveal?path='+encodeURIComponent(path))
    .then(r=>r.json())
    .then(j=>{if(!j.ok)toast('⚠ '+(j.error||'Could not reveal file'));else if(j.note)toast(j.note);})
    .catch(()=>toast('⚠ Could not reach the tracker server.'));
}
function mdToHtml(md){
  const lines=(md||'').split('\n');let html='',inUl=false;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const closeUl=()=>{if(inUl){html+='</ul>';inUl=false;}};
  for(const raw of lines){const l=raw.trim();
    if(!l){closeUl();continue;}
    if(l.startsWith('### ')){closeUl();html+='<h3>'+inline(l.slice(4))+'</h3>';}
    else if(l.startsWith('## ')){closeUl();html+='<h2>'+inline(l.slice(3))+'</h2>';}
    else if(l.startsWith('# ')){closeUl();html+='<h1>'+inline(l.slice(2))+'</h1>';}
    else if(l.startsWith('> ')){closeUl();html+='<p class="muted">'+inline(l.slice(2))+'</p>';}
    else if(l.startsWith('- ')){if(!inUl){html+='<ul>';inUl=true;}html+='<li>'+inline(l.slice(2))+'</li>';}
    else{closeUl();html+='<p>'+inline(l)+'</p>';}}
  closeUl();return html;
}
function openDoc(id,which){const a=state.apps.find(x=>x.id===id);if(!a)return;
  const k=DOC_KIND[which];
  const md=a[k.md];
  const ext=a[k.link];
  if(!md){if(ext){openExternal(ext);return;}alert('No '+k.kind.toLowerCase()+' yet — the daily run drafts it for To Apply roles.');return;}
  const title=k.kind+' — '+a.company;
  const w=window.open('','_blank');if(!w){alert('Pop-up blocked — allow pop-ups to view documents.');return;}
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title>'+
   '<style>body{font-family:Georgia,"Times New Roman",serif;max-width:740px;margin:40px auto;padding:0 24px;color:#222;line-height:1.5}'+
   'h1{font-size:24px;margin:0 0 2px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #ccc;padding-bottom:3px;margin:20px 0 8px;color:#191917}'+
   'h3{font-size:14px;margin:12px 0 2px}ul{margin:4px 0 10px;padding-left:20px}li{margin:3px 0}p{margin:6px 0}.muted{color:#777;font-style:italic}'+
   '.bar{position:fixed;top:0;left:0;right:0;background:#191917;color:#fff;padding:8px 16px;font-family:system-ui,sans-serif;font-size:13px;display:flex;gap:12px;align-items:center}'+
   '.bar button{background:#fff;color:#191917;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}@media print{.bar{display:none}body{margin:0}}</style></head>'+
   '<body><div class="bar">'+(which==='prep'?'Claude-written prep — check the facts against your resume.':'Claude-written draft — review before sending.')+' <button onclick="window.print()">Print / Save as PDF</button></div>'+
   '<div style="height:34px"></div>'+mdToHtml(md)+'</body></html>');
  w.document.close();
}
function downloadDoc(id,which){const a=state.apps.find(x=>x.id===id);if(!a)return;
  const k=DOC_KIND[which];const md=a[k.md];if(!md){alert('Nothing to download yet.');return;}
  const safe=(a.company+' - '+k.kind).replace(/[^\w .-]/g,'');

    lastContact:g('lastContact'),contact:g('contact'),resumeVersion:g('resumeVersion'),coverLetter:g('coverLetter'),
    source:g('source'),url:g('url'),notes:g('notes'),resumeLink:g('resumeLink'),coverLink:g('coverLink')};
  if(editingId){Object.assign(state.apps.find(x=>x.id===editingId),data);}
  else{data.id=uid();data.dateAdded=today;state.apps.unshift(data);editingId=data.id;}
  stampApplied(state.apps.find(x=>x.id===editingId));stampClosed(state.apps.find(x=>x.id===editingId));
  save();return editingId;
}
function saveEdit(){if(persistForm()){closeEdit();render();}}
function deleteCurrent(){if(!editingId)return;const a=state.apps.find(x=>x.id===editingId);
  if(confirm(`Delete ${a.company} — ${a.role||''}? This can't be undone.`)){state.apps=state.apps.filter(x=>x.id!==editingId);save();editFrom=null;closeEdit();render();}}

/* ---------- import / export ---------- */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download=name;x.click();URL.revokeObjectURL(u);}
function exportJSON(){download('launchpad-data.json',JSON.stringify(state.apps,null,2),'application/json');}
function exportCSV(){
  const cols=['company','role','status','tier','arrangement','location','salary','excitement','dateApplied','nextFollowup','lastContact','contact','resumeVersion','coverLetter','source','url','notes'];
  const q=s=>'"'+((s||'')+'').replace(/"/g,'""')+'"';
  const rows=[cols.join(',')].concat(state.apps.map(a=>cols.map(c=>q(a[c])).join(',')));
  download('launchpad.csv',rows.join('\n'),'text/csv');
}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;
    if(confirm(`Import ${data.length} applications? This replaces your current ${state.apps.length}. (Export first if unsure.)`)){
      state.apps=data;state.apps.forEach(a=>{if(!a.id)a.id=uid();});save();render();}
  }catch(e){alert('That file is not valid tracker JSON.');}ev.target.value='';};
  r.readAsText(f);}

/* ---------- boot ---------- */
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeEdit();});
// Escape closes the top layer only: palette and menus first, then a form, then a panel.
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(window.Screens&&Screens.escape())return;
  if(document.getElementById('modal').classList.contains('show'))closeEdit();});
/* Theme: follow the system until you pick light or dark; the choice stays in this browser. */
const THEMES=['system','light','dark'];
function themeNow(){let t='';try{t=localStorage.getItem('launchpad_theme')||'';}catch(e){}return THEMES.includes(t)?t:'system';}
function paintTheme(){const t=themeNow();if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  document.querySelectorAll('[data-themelbl]').forEach(el=>el.textContent='Theme: '+t);}
function cycleTheme(){const t=THEMES[(THEMES.indexOf(themeNow())+1)%THEMES.length];try{localStorage.setItem('launchpad_theme',t);}catch(e){}paintTheme();}
paintTheme();
document.getElementById('btnMore').addEventListener('click',e=>{e.stopPropagation();document.getElementById('moremenu').classList.toggle('show');});
document.addEventListener('click',()=>document.getElementById('moremenu').classList.remove('show'));
fillStatusSelect();
loadColPrefs();
initFilters();
readHash();
applyChrome();
stamp();
render();
document.getElementById('btnCols').addEventListener('click',e=>{e.stopPropagation();const m=document.getElementById('colmenu');const open=!m.classList.contains('show');if(open)buildColMenu();m.classList.toggle('show',open);});
document.addEventListener('click',e=>{if(!e.target.closest('#colwrap'))document.getElementById('colmenu').classList.remove('show');});
/* The server is there but the data didn't load: show that plainly instead of demo rows. */
function showLoadError(){
  loaded=true;state.apps=[];render();
  const chip=document.getElementById('filestat');chip.textContent='⚠ data.json · not loaded';chip.className='filechip warn';
  const w=document.createElement('div');w.id='loadwarn';
  w.className='banner';
  w.innerHTML='<b>Your jobs and people could not be loaded from the tracker server</b> — '+esc(serverLoadError)+
    '. Nothing shown here is your data, and changes will not be saved. <button class="btn" onclick="location.reload()">Reload</button>';
  document.querySelector('.controls').before(w);
}
// With a server, the first draw waits for people and Autopilot too (see the last script on
// this page). With none, the browser's own copy is the data.
window.syncReady=initServerSync().then(ok=>{
  if(ok)return ok;
  if(serverLoadError){showLoadError();}
  else{load();initFileSync();}
  return ok;
});
</script>

window.syncReady.then(()=>Promise.all([window.peopleReady,window.autopilotReady]).catch(()=>{})).then(markLoaded);</script>
